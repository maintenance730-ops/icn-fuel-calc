<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<meta name="theme-color" content="#121417"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Fuel Calc">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>ICN Fuel Calculator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
</head><body>
<style>
/* Layout: 종이 양식 복제 — 상단 JET A-1 밴드, 항공사 칩, 항공사별 양식 표(칸 배치 그대로), 하단 고정 디스크레판시 바 */
:root{
  --paper:#e9ecf0; --card:#ffffff; --ink:#151d27; --muted:#5b6777; --rule:#9aa5b2; --line:#d2d8df;
  --pen:#1d43b0; --in-bg:#ffffff; --band:#121417; --band-fg:#f4f4f2;
  --t-EK:#e6eaee; --t-UL:#efeef7; --t-LOT:#e3ecf5; --t-KC:#ebf2e3; --t-AI:#f3eee4;
  --ok:#17784a; --ok-bg:#dff2e7; --bad:#bf2427; --bad-bg:#fbe1e1;
  --f-disp:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-form:"Arimo",Arial,Helvetica,sans-serif;
  --memo:#fff3cc; --memo-fg:#6b4a00; --memo-bd:#e0b84a;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --memo:#2c2410; --memo-fg:#f2c867; --memo-bd:#7a5f1c;
  --paper:#0d1217; --card:#151c25; --ink:#e4e9f0; --muted:#94a0b0; --rule:#4a5666; --line:#283240;
  --pen:#95b5ff; --in-bg:#0b1016; --band:#050608; --band-fg:#f4f4f2;
  --t-EK:#19202a; --t-UL:#1c1b28; --t-LOT:#16202c; --t-KC:#1a2318; --t-AI:#231f18;
  --ok:#52c890; --ok-bg:#11281d; --bad:#ff7272; --bad-bg:#371617; color-scheme:dark}}
:root[data-theme="dark"]{
  --memo:#2c2410; --memo-fg:#f2c867; --memo-bd:#7a5f1c;
  --paper:#0d1217; --card:#151c25; --ink:#e4e9f0; --muted:#94a0b0; --rule:#4a5666; --line:#283240;
  --pen:#95b5ff; --in-bg:#0b1016; --band:#050608; --band-fg:#f4f4f2;
  --t-EK:#19202a; --t-UL:#1c1b28; --t-LOT:#16202c; --t-KC:#1a2318; --t-AI:#231f18;
  --ok:#52c890; --ok-bg:#11281d; --bad:#ff7272; --bad-bg:#371617; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--band)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pen);outline-offset:-2px}

.band{background:var(--band);color:var(--band-fg);padding-block:13px 11px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band-in{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-disp);font-weight:700;font-size:21px;letter-spacing:.06em;text-transform:uppercase}
.brand{display:flex;align-items:center;gap:9px;white-space:nowrap;min-width:0}.jet{white-space:nowrap;flex:none}
@media (max-width:420px){.brand small{display:none}.brand{font-size:19px}}.logo{width:30px;height:30px;border-radius:7px;flex:none}
.brand small{font-weight:500;opacity:.6;letter-spacing:.08em;font-size:13px;margin-left:6px}
.jet{font-family:var(--f-disp);font-weight:700;letter-spacing:.14em;font-size:13px;border:1.5px solid var(--band-fg);padding:1px 7px}

.wrap{max-width:640px;margin:0 auto;padding-block:12px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
#view{display:flex;flex-direction:column;gap:12px}

.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;flex-direction:row;align-items:center;gap:7px;min-width:70px;padding:6px 10px 6px 6px;border:1.5px solid var(--line);background:var(--card);border-radius:8px;text-align:left}
.chip .lg{width:30px;height:30px;border-radius:6px;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none;box-shadow:0 0 0 1px var(--line)}.chip .lg img{width:28px;height:28px;object-fit:contain}
.chip .ct{display:flex;flex-direction:column;align-items:flex-start}
.chip b{font-family:var(--f-disp);font-size:20px;letter-spacing:.04em;line-height:1}
.chip .ct>span{font-size:11px;color:var(--muted);white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.chip[aria-pressed="true"] .ct>span{color:inherit;opacity:.75}

.head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.head h1{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:clamp(20px,6.4vw,27px)!important}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.head h1{margin:0;font-family:var(--f-disp);font-size:27px;font-weight:700;letter-spacing:.02em;line-height:1.05}
.head .sub{color:var(--muted);font-size:12.5px}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--bad-bg);color:var(--bad)}
.legend{display:flex;gap:10px;font-size:11.5px;color:var(--muted);align-items:center}
.sw{display:inline-block;width:14px;height:11px;border:1px solid var(--rule);vertical-align:-1px;margin-right:4px}
.sw.i{background:var(--in-bg)} .sw.a{background:color-mix(in srgb,var(--pen) 13%,var(--card))}
.acts{display:flex;gap:6px;flex-shrink:0}
.btn{white-space:nowrap;min-width:62px;text-align:center;border:1.5px solid var(--line);background:var(--card);border-radius:7px;padding:6px 11px;font-size:13px;font-weight:500}
.btn:disabled{opacity:.4;cursor:default}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:4px 10px;font-size:12.5px;font-family:var(--f-num);color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* ===== paper form ===== */
/* 항공사별 종이: --tint 종이색, --lbl 라벨칸, --entry 기입칸, --frame 선 */
.f-EK{--tint:#dfe4e9;--lbl:transparent;--entry:#f3f5f7;--frame:#3a4450}
.f-UL{--tint:#f4f3f9;--lbl:#dcdbe3;--entry:#ffffff;--frame:#2a2a33}
.f-LOT{--tint:#e2ecf6;--lbl:transparent;--entry:#eef4fb;--frame:#1c2632}
.f-KC{--tint:#edf3e3;--lbl:transparent;--entry:#f8fbf2;--frame:#22281d}
.f-3S{--tint:#f1f2f3;--lbl:transparent;--entry:#ffffff;--frame:#3b4047}
.hatch{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--frame) 45%,transparent) 0 1.5px,transparent 1.5px 6px)!important}
.f3c{vertical-align:top!important}.f3c .lb{font-size:11px;padding:4px 5px 2px;font-weight:700}.f3c .ci input{font-size:15px}.f3c .co{font-size:15px}.f-3S .pmb{min-width:22px;font-size:15px}.f-3S .circ{justify-content:flex-start;padding:0 4px 2px}
.f-AI{--tint:#f5f0e1;--lbl:#d3d3d0;--entry:#fbf2c2;--frame:#30302c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .f-EK{--tint:#1a2129;--entry:#121820;--frame:#7f8d9c}
:root:not([data-theme="light"]) .f-UL{--tint:#1c1b26;--lbl:#2a2936;--entry:#13121b;--frame:#8a88a0}
:root:not([data-theme="light"]) .f-LOT{--tint:#16212d;--entry:#0f1822;--frame:#7f95ad}
:root:not([data-theme="light"]) .f-KC{--tint:#1a2318;--entry:#121a10;--frame:#8a9a7c}
:root:not([data-theme="light"]) .f-3S{--tint:#1b1f24;--entry:#11151a;--frame:#8d96a2}
:root:not([data-theme="light"]) .f-AI{--tint:#24201a;--lbl:#34312b;--entry:#2b2611;--frame:#a09a86}}
:root[data-theme="dark"] .f-EK{--tint:#1a2129;--entry:#121820;--frame:#7f8d9c}
:root[data-theme="dark"] .f-UL{--tint:#1c1b26;--lbl:#2a2936;--entry:#13121b;--frame:#8a88a0}
:root[data-theme="dark"] .f-LOT{--tint:#16212d;--entry:#0f1822;--frame:#7f95ad}
:root[data-theme="dark"] .f-KC{--tint:#1a2318;--entry:#121a10;--frame:#8a9a7c}
:root[data-theme="dark"] .f-3S{--tint:#1b1f24;--entry:#11151a;--frame:#8d96a2}
:root[data-theme="dark"] .f-AI{--tint:#24201a;--lbl:#34312b;--entry:#2b2611;--frame:#a09a86}
.form{background:var(--tint);border:2px solid var(--frame);border-radius:1px;overflow-x:auto;box-shadow:0 1px 0 color-mix(in srgb,var(--ink) 12%,transparent),0 6px 18px -10px color-mix(in srgb,var(--ink) 35%,transparent)}
table.fm{width:100%;border-collapse:collapse;table-layout:fixed}
.fm+.fm{border-top:2px solid var(--frame)}
.fm td,.fm th{border:1px solid color-mix(in srgb,var(--frame) 60%,transparent);padding:0;vertical-align:middle}
.fm th,.fm td.lb{background:var(--lbl)}
.fm tr:first-child>*{border-top:0} .fm tr>*:first-child{border-left:0} .fm tr>*:last-child{border-right:0} .fm tr:last-child>*{border-bottom:0}
.fm th{font-family:var(--f-form);font-weight:700;letter-spacing:.01em;font-size:12.5px;padding:6px 6px;line-height:1.1;text-align:center}
.fm.ul td{height:66px}.fm.ul td:not(.lc)>.ci{height:100%}.fm.ul td.lc{vertical-align:top;padding:0}.fm.ul td.lc .k{float:none;margin-left:2px}.fm.ul td.lc .lb{padding:5px 6px 2px;font-size:12px}.fm.ul td.lc .ci,.fm.ul td.lc .co{min-height:38px}.fm.ul .tn{padding:4px;text-align:center;font-size:12.5px}.fm.ul tr:nth-last-child(-n+2) td{height:auto}
.fm th.ttl{font-size:15px;letter-spacing:.06em;padding:8px 6px}
.lb{font-family:var(--f-form);font-weight:400;font-size:12.5px;letter-spacing:0;padding:6px 7px;line-height:1.15}
.uc .lb,.uc th{text-transform:uppercase}
.lb small{display:block;font-size:11px;color:var(--muted);letter-spacing:.02em}
.lb .k{float:right;color:var(--muted);margin-left:4px}
.lt{font-family:var(--f-form);font-weight:700;font-size:14px;text-align:center}
.faint{color:var(--muted);font-weight:500}
.cap{font-size:10.5px;color:var(--muted);padding:3px 7px;font-family:var(--f-form)}
.shade{background:color-mix(in srgb,var(--ink) 7%,transparent)}

.ci{display:flex;align-items:stretch;background:var(--entry,var(--in-bg));min-height:40px}
.ci input{flex:1;min-width:0;width:100%;border:0;background:transparent;padding:8px 5px;font-family:var(--f-num);font-size:16px;font-weight:500;color:var(--pen);text-align:right;outline:none;font-variant-numeric:tabular-nums}
.ci input.txt{font-family:var(--f-body);font-size:14px;text-align:left;text-transform:uppercase}
.ci input::placeholder{color:var(--muted);opacity:.55;text-transform:none}
.ci:focus-within{box-shadow:inset 0 0 0 2px var(--pen)}
.ci .pre{align-self:center;padding-left:7px;font-family:var(--f-disp);font-weight:600;font-size:13px;color:var(--muted)}
.pmb{border:0;border-left:1px solid var(--line);background:transparent;min-width:28px;padding:0 4px;font-weight:600;color:var(--pen);font-size:17px}
.ci input.sgi{font-size:14px;padding:8px 2px;letter-spacing:-.01em}
.pmb.l{border-left:0;border-right:1px solid var(--line)}
.co{display:block;min-height:40px;padding:9px 6px;text-align:right;font-family:var(--f-num);font-size:16px;font-weight:600;color:var(--pen);background:color-mix(in srgb,var(--pen) 13%,transparent);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.co:empty::after{content:"–";color:var(--muted);font-weight:400}
.co.ok{background:var(--ok-bg);color:var(--ok)} .co.over{background:var(--bad-bg);color:var(--bad)}
.hint{font-size:11px;color:var(--muted);padding:2px 6px 4px;text-align:right;font-family:var(--f-num);line-height:1.3}
.hint.over{color:var(--bad);font-weight:600} .hint.ok{color:var(--ok)}
.circ{display:flex;flex-wrap:nowrap;justify-content:center;align-items:center;gap:0 1px;padding:3px 2px;white-space:nowrap}
.circ button{border:1.5px solid transparent;background:transparent;border-radius:50%;padding:2px 5px;font-family:var(--f-form);font-weight:700;font-size:11px;color:var(--muted);text-transform:uppercase}
.circ button[aria-pressed="true"]{border-color:var(--pen);color:var(--pen)}
.gs{display:inline-flex;gap:1px;margin-left:4px;vertical-align:middle}
.gs button{border:1px solid var(--frame);background:var(--entry);width:20px;height:20px;padding:0;font-size:11px;font-family:var(--f-form);font-weight:700;border-radius:2px;color:var(--muted)}
.gs button[aria-pressed="true"]{border-radius:50%}
.gs button[aria-pressed="true"]{border:1.5px solid var(--pen);color:var(--pen)}
.sgn{display:flex;align-items:center;justify-content:flex-end;gap:4px;padding-left:3px}
.sgn .c{display:inline-flex;gap:3px;font-family:var(--f-num);font-weight:600;font-size:14px;color:var(--muted)}
.sgn .c i{font-style:normal;width:18px;height:18px;display:inline-grid;place-items:center;border-radius:50%;border:1.5px solid transparent}
.sgn .c i.on{border-color:currentColor;color:var(--pen)}
.ci.bx{justify-content:flex-end;align-items:center;padding:5px 6px 5px 2px}
.ci.sgb{padding:0}.ci.sgb input.bxi{margin:5px 6px}
.ci.bx input.bxi{flex:none;width:calc(var(--n)*1.9ch + .45ch);height:30px;padding:0;font-size:var(--bxfs,16px);letter-spacing:.9ch;text-align:right;
  background-image:linear-gradient(to right,var(--frame) 0 1px,transparent 1px),linear-gradient(to bottom,var(--frame) 0 1px,transparent 1px calc(100% - 1px),var(--frame) calc(100% - 1px));
  background-size:1.9ch 100%,calc(var(--n)*1.9ch + 1px) 100%;background-repeat:repeat-x,no-repeat;background-position:0 0,0 0}
.ci.bx:focus-within{box-shadow:none}.ci.bx input.bxi:focus{box-shadow:0 0 0 2px var(--pen)}
.bxo{display:flex;justify-content:flex-end;align-items:center;padding:5px 6px;font-size:var(--bxfs,16px);text-overflow:clip}
.bxo i{font-style:normal;display:inline-grid;place-items:center;width:1.9ch;height:30px;border:1px solid var(--frame);margin-left:-1px}
.bxo b{font-weight:600;width:.8ch;text-align:center}
.sgn.bxo{gap:0}.sgn.bxo .c{margin-right:6px}.bxo .val{display:inline-flex;align-items:center}
.mk{display:block;margin-top:3px;font-family:var(--f-body);font-size:10.5px;font-weight:600;color:var(--memo-fg);text-transform:none;letter-spacing:0}
.memo{background:var(--memo);color:var(--memo-fg);border-left:3px solid var(--memo-bd);font-family:var(--f-body);font-size:12px;line-height:1.5;padding:7px 9px;text-align:left;font-weight:500;text-transform:none;letter-spacing:0}
.memo b{font-weight:700}.memo .en{display:block;opacity:.75;font-size:11px}
.tog{display:inline-flex;border:1px solid var(--rule);border-radius:4px;overflow:hidden;margin-left:4px;vertical-align:middle}
.tog button{border:0;background:transparent;padding:0 5px;font-size:11px;font-family:var(--f-num);color:var(--muted);text-transform:none}
.tog button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* aux cards */
.aux{background:var(--card);border:1px dashed var(--rule);border-radius:9px}
.aux h2{margin:0;padding:8px 12px 0;font-size:12.5px;font-weight:600;color:var(--muted)}
.aux .g{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr);gap:8px;padding:8px 12px 12px;align-items:end}
.aux label{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--muted);min-width:0}
.aux .ci,.aux .co{border:1px solid var(--line);border-radius:6px;overflow:hidden}
.ups{display:flex;flex-direction:column;gap:8px;padding:8px 12px 12px}
.up{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 30px;gap:6px;align-items:center}
.up .n{font-family:var(--f-disp);font-weight:700;color:var(--muted)}
.up .ci{border:1px solid var(--line);border-radius:6px;overflow:hidden}
.x{border:0;background:transparent;color:var(--muted);font-size:20px}
.add{align-self:flex-start;border:1.5px dashed var(--line);background:transparent;border-radius:7px;padding:5px 11px;font-size:13px;color:var(--pen);font-weight:500}

/* explain */
.xbtn{width:100%;display:flex;justify-content:space-between;align-items:center;border:1.5px solid var(--line);background:var(--card);border-radius:9px;padding:11px 14px;font-size:14px;font-weight:600;color:var(--ink)}
.xbtn .ar{font-size:12px;color:var(--muted);transition:transform .2s}
.xbtn[aria-expanded="true"] .ar{transform:rotate(180deg)}
.exp{background:var(--card);border:1px solid var(--line);border-radius:9px;margin-top:-4px}
.st{display:grid;grid-template-columns:24px minmax(0,1fr);gap:4px 10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.st:last-child{border-bottom:0}
.st .no{width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:12px;font-weight:700;font-family:var(--f-num)}
.st .tt{font-weight:600;font-size:14px;line-height:1.35}
.st .tt b{font-family:var(--f-disp);letter-spacing:.03em;font-size:15px}
.st .ds{grid-column:2;font-size:12.5px;color:var(--muted);line-height:1.5}
.st .fx{grid-column:2;font-family:var(--f-num);font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.st .nx{grid-column:2;font-family:var(--f-num);font-size:14.5px;color:var(--pen);overflow-wrap:anywhere}
.st .nx strong{font-weight:700}
.st .wait{grid-column:2;font-size:12.5px;color:var(--muted);font-style:italic}
.st.vd{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.st.vd.ok .tt{color:var(--ok)} .st.vd.over .tt{color:var(--bad)}
@media (prefers-reduced-motion: reduce){.xbtn .ar{transition:none}}

/* tools */
.sec{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sec h2{margin:0;padding:8px 14px;font-family:var(--f-disp);font-weight:600;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.trow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,48%);gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow .ci,.trow .co{border:1px solid var(--line);border-radius:6px;overflow:hidden}
.note{font-size:12.5px;color:var(--muted);padding:10px 14px;line-height:1.55}

/* bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--band);color:var(--band-fg);padding-top:9px;padding-bottom:calc(9px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar-in{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.bar .l{font-family:var(--f-disp);letter-spacing:.08em;font-size:13px;opacity:.7;text-transform:uppercase;display:block}
.bar .v{font-family:var(--f-num);font-weight:600;font-size:20px}
.bar .tag{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.tag.ok{color:#5fd39a} .tag.over{color:#ff7b7b;background:rgba(255,80,80,.12)} .tag.none{opacity:.6}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:8px;font-size:13px;z-index:20}
@media (max-width:380px){.fm th{font-size:12px}.lb{font-size:12px}.ci input,.co{font-size:15px}}
</style>

<script>
// ===== Fuel calc core v2 (DOM-free) =====
const USG_L = 3.78541, IG_L = 4.54609;
const UNIT_L = { L: 1, USG: USG_L, IG: IG_L };
const N = x => (x === '' || x == null || x === '-' || isNaN(+x)) ? null : +x;
const sumN = arr => { const v = arr.map(N).filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) : null; };
const sub = (a, b) => (a == null || b == null) ? null : a - b;
const pct = (a, b) => (a == null || !b) ? null : a / b * 100;

// uplifts: [{v, r}], unit: 'L'|'USG'|'IG'  → raw (no rounding)
function fuelCalc(uplifts, unit, sgIn) {
  const sg = N(sgIn), m = UNIT_L[unit] || 1;
  const vals = (uplifts || []).map(u => N(u.v)).filter(x => x != null);
  if (!vals.length) return { sg, vol: null, L: null, USG: null, IG: null, kg: null };
  const vol = vals.reduce((a, b) => a + b, 0), L = vol * m;
  return { sg, vol, L, USG: L / USG_L, IG: L / IG_L, kg: sg ? L * sg : null };
}
const toL = (kg, sg) => (kg == null || !sg) ? null : kg / sg;

const AIRLINES = {
  EK: { code: 'EK', name: 'Emirates', types: ['B777/A380'], units: ['L', 'USG'],
    form: 'Aircraft Fuel and Fluids Servicing Record',
    compute(v, f) {
      const A = N(v.A), C = N(v.C), D = N(v.D), G = N(v.G);
      const B = sub(A, C), E = sub(D, C), F = f.kg, H = sub(G, C), J = sub(F, H);
      return { B, E, reqL: toL(E, f.sg), F, H, J, Jp: pct(J, H), disc: J };
    } },

const s1=n=>{ if(n==null||!isFinite(n)) return ''; const t=f1(n); return (Math.round(n*10)/10>0?'+':'')+t; };

const O=(k,o={})=>`<output class="co${o.box?' bxo':''}" data-o="${k}" data-fmt="${o.fmt||''}"${o.box?` data-box="${o.box}"`:''}${o.disc?' data-disc="1"':''}>${o.box?boxes('',o.box):''}</output>`;
function boxes(t,n){const ch=[...String(t)];const d=ch.filter(c=>/\d/.test(c)).length;let h='<i></i>'.repeat(Math.max(n-d,0));for(const c of ch)h+=/\d/.test(c)?`<i>${c}</i>`:`<b>${c==='-'?'−':c}</b>`;return h;}

  ? `<div class="ci">${''}<input id="f-up0" data-up="0" data-f="v" inputmode="decimal" autocomplete="off" value="${esc((s.uplifts[0]||{}).v)}" aria-label="급유량"><button class="pmb" data-addup="1" aria-label="급유차 추가">+</button></div>`
  : `<output class="co" data-bwtot="1"></output><div class="hint">${s.uplifts.length}대 합산 · 아래에서 수정</div>`;
const UNITS=(labels)=>`<div class="circ">${A.units.map((u,i)=>`<button data-bu="${u}" aria-pressed="${s.bu===u}">${labels[i]}</button>`).join('<span class="faint">/</span>')}</div>`;

const nv=x=>x==null||x===''||!isFinite(+x)?null:+x;
const sumTxt=(keys)=>{const xs=keys.map(k=>nv(v[k])).filter(x=>x!=null);return xs.length?xs.map(f1).join(' + '):null;};
function fuelStep(f,label){
  const sg=f1v(s.sg), u=s.bu, multi=s.uplifts.filter(x=>nv(x.v)!=null).length>1;
  const conv=u==='USG'?' × 3.78541':u==='IG'?' × 4.54609':'';
  const unitName=u==='USG'?'USG':u==='IG'?'Imp gal':'L';
  return {t:label, d:`급유차에 찍힌 양(${unitName})을 kg로 바꾼 값${multi?' · 여러 대 합계':''}${u!=='L'?` (1 ${unitName} = ${u==='USG'?'3.78541':'4.54609'} L)`:''}`,
    fx:`${unitName}${conv} × SG`, nx: f.kg==null?null:`${f1(f.vol)}${conv} × ${sg} = <strong>${f1(f.kg)} kg</strong>`};
}
const f1v=x=>{const n=nv(x);return n==null?'':String(n);};
const sub2=(a,b,r,unit=' kg')=>a==null||b==null||r==null?null:`${f1(a)} − ${f1(b)} = <strong>${s1(r).replace(/^\+/, '')==f1(r)?f1(r):s1(r)}${unit}</strong>`;
const tsum=(pre,keys,res,unit=' kg')=>{const t=sumTxt(keys);return t==null||res==null?null:`${t} = <strong>${f1(res)}${unit}</strong>`;};

  ];},
  AI:(f,o)=>{const T=A.tanks.map((_,i)=>i);return [
    {t:'<b>Total X</b> 급유 전 탱크 합계',d:'In Tank (X) 칸 합계',fx:'X 합',nx:tsum(0,T.map(i=>'pre_'+i),o.X)},
    {t:'<b>Total Y</b> 출발 탱크 합계',d:'Departure (Y) 칸 합계',fx:'Y 합',nx:tsum(0,T.map(i=>'dep_'+i),o.Y)},
    fuelStep(f,'<b>Actual Uplift Kgs</b>'),
    {t:'<b>Calculated (Y − X)</b>',d:'탱크 기준으로 늘어난 양',fx:'Y − X',nx:sub2(o.Y,o.X,o.calc)},
    {t:'<b>Discrepancy %</b>',d:'급유차 기준 대비 차이 비율. kg 차이도 같이 표시',fx:'(Actual − Calc) ÷ Actual × 100',nx:o.dp==null?null:`(${f1(o.act)} − ${f1(o.calc)}) ÷ ${f1(o.act)} × 100 = <strong>${p2(o.dp)} %</strong> (${s1(o.dkg)} kg)`},
  ];},
};
function explainHTML(id,f,o,dState){
  const steps=EXPL[id](f,o);
  let h=steps.map((x,i)=>`<div class="st"><span class="no">${i+1}</span><div class="tt">${x.t}</div><div class="ds">${x.d}</div><div class="fx">${x.fx}</div>${x.nx?`<div class="nx">= ${x.nx}</div>`:'<div class="wait">값을 입력하면 계산돼요</div>'}</div>`).join('');
  if(o.disc!=null){const ok=dState==='ok';h+=`<div class="st vd ${dState}"><span class="no">✓</span><div class="tt">판정: ${s1(o.disc)} kg → ${ok?'±'+esc(S.limit)+' kg 이내, 정상':'±'+esc(S.limit)+' kg 초과, 재확인 필요'}</div><div class="ds">${ok?'':'탱크 값, SG, 급유량 입력을 다시 확인하세요.'}</div></div>`;}
  return h;
}

/* ---------- tools ---------- */
function toolsView(){
  const t=S.tools;
  return `<div class="head"><div><h1>도구 · 설정</h1><div class="sub">단위 변환 · 오일 소모율 · 경고 한도</div></div></div>
  <section class="sec"><h2>Discrepancy 경고 한도</h2>
    <div class="trow"><div>모든 항공사 공통 (±kg)</div><div class="ci"><input id="t-limit" data-limit="1" inputmode="decimal" value="${esc(S.limit)}"><span class="pre" style="padding-right:8px">kg</span></div></div></section>
  <section class="sec"><h2>Fuel Unit Converter</h2>
    <div class="trow"><div class="seg">${['L','USG','IG','KG'].map(x=>`<button data-tu="${x}" aria-pressed="${t.cu===x}">${x}</button>`).join('')}</div><div class="ci"><input id="t-cv" data-t="cv" inputmode="decimal" value="${esc(t.cv)}" placeholder="값" aria-label="변환할 값"></div></div>
    <div class="trow"><div>SG</div><div class="ci"><input id="t-csg" data-t="csg" inputmode="decimal" value="${esc(t.csg)}" aria-label="SG"></div></div>
    ${['KG','L','USG','IG'].map(u=>`<div class="trow"><div>${u==='IG'?'Imp gal':u==='KG'?'kg':u}</div><output class="co" id="cv-${u}"></output></div>`).join('')}
    <div class="note">1 USG = 3.78541 L · 1 Imp gal = 4.54609 L · kg = L × SG</div></section>
  <section class="sec"><h2>Oil Consumption Rate</h2>
    <div class="trow"><div>비행시간 HH</div><div class="ci"><input id="t-hh" data-t="hh" inputmode="numeric" value="${esc(t.hh)}" aria-label="시간"></div></div>
    <div class="trow"><div>비행시간 MM</div><div class="ci"><input id="t-mm" data-t="mm" inputmode="numeric" value="${esc(t.mm)}" aria-label="분"></div></div>
    <div class="trow"><div>오일 보급 QTS</div><div class="ci"><input id="t-qt" data-t="qt" inputmode="decimal" value="${esc(t.qt)}" aria-label="쿼트"></div></div>
    <div class="trow"><div>소모율 <span class="faint">qt/hr</span></div><output class="co" id="oil"></output></div></section>`;
}
function updateTools(){
  const t=S.tools, x=parseFloat(t.cv), sg=parseFloat(t.csg);
  let L=null; if(!isNaN(x)){ L=t.cu==='KG'?(sg?x/sg:null):x*({L:1,USG:3.78541,IG:4.54609}[t.cu]); }
  const out={KG:L!=null&&sg?L*sg:null,L,USG:L!=null?L/3.78541:null,IG:L!=null?L/4.54609:null};
  for(const u in out){const e=$('#cv-'+u); if(e) e.textContent=f1(out[u]);}
  const hr=(+t.hh||0)+(+t.mm||0)/60, q=parseFloat(t.qt);
  $('#oil').textContent=hr>0&&!isNaN(q)?(q/hr).toFixed(2):'';
  $('#bar').innerHTML=`<div class="bar-in"><span class="l">경고 한도 ±${esc(S.limit)} kg</span><span class="l">ICN Line Maintenance</span></div>`;
  save();
}

/* ---------- paint ---------- */
function update(){
  const id=S.cur; if(id==='TOOLS') return updateTools();
  const {f,o}=runAirline(id,s);
  const lim=parseFloat(S.limit), dState=o.disc==null?'':(!isNaN(lim)&&Math.abs(o.disc)>lim?'over':'ok');
  const F=(x,fm)=>fm==='raw'?(x??''):fm==='s'?s1(x):fm==='p'?p2(x):f1(x);
  $$('[data-o]').forEach(el=>{const t=F(o[el.dataset.o],el.dataset.fmt); if(el.dataset.box) el.innerHTML=boxes(t,+el.dataset.box); else el.textContent=t; if(el.dataset.disc){el.classList.toggle('ok',dState==='ok');el.classList.toggle('over',dState==='over');}});
  $$('[data-pm]').forEach(el=>{const x=o[el.dataset.pm];{const t=x==null?'':f1(Math.abs(x)),vv=el.querySelector('.val'); if(el.dataset.box) vv.innerHTML=boxes(t,+el.dataset.box); else vv.textContent=t;}el.querySelectorAll('i').forEach(i=>i.classList.toggle('on',x!=null&&Math.round(x*10)!==0&&((i.dataset.s==='+')===(x>0))));el.classList.toggle('ok',dState==='ok');el.classList.toggle('over',dState==='over');});
  const m={L:1,USG:3.78541,IG:4.54609}[s.bu]||1;
  $$('[data-h]').forEach(el=>{
    const k=el.dataset.h; let x=k==='fkg'?f.kg:o[k], suf=el.dataset.suf;
    if(el.dataset.conv&&x!=null){x=x/m;suf=' '+UNAME[s.bu]+suf;}
    if(k==='fkg'&&f.L!=null&&s.bu!=='L') suf+=' · '+f1(f.L)+' L';
    el.textContent=x==null?'':el.dataset.pre+F(x,el.dataset.fmt)+suf;
    if(el.dataset.hdisc){el.classList.toggle('ok',dState==='ok');el.classList.toggle('over',dState==='over');}
  });
  $$('[data-bwtot]').forEach(el=>el.textContent=f1(f.vol));
  if(S.explain&&$('#exp')) $('#exp').innerHTML=explainHTML(id,f,o,dState);
  const tag=dState==='ok'?`<span class="tag ok">±${esc(S.limit)} 이내</span>`:dState==='over'?`<span class="tag over">±${esc(S.limit)} 초과</span>`:'<span class="tag none">입력 대기</span>';
  const lab=id==='LOT'?'Remaining − ARR':id==='AI'?'Actual − Calc':id==='3S'?'IND − CALC FOB':'Discrepancy';
  $('#bar').innerHTML=`<div class="bar-in"><div><span class="l">${A.code} ${lab}</span><span class="v">${o.disc==null?'–':s1(o.disc)+' kg'}</span></div>${tag}</div>`;
  save();
}
function render(){
  $('#chips').innerHTML=ORDER.map(id=>{const a=AIRLINES[id];return `<button class="chip" aria-pressed="${S.cur===id}" data-go="${id}">${LOGOS[id]?`<span class="lg"><img src="${LOGOS[id]}" alt=""></span>`:''}<span class="ct"><b>${a.code}</b><span>${esc(a.name)}</span></span></button>`;}).join('')+`<button class="chip" aria-pressed="${S.cur==='TOOLS'}" data-go="TOOLS"><span class="ct"><b>⚙︎</b><span>도구 · 설정</span></span></button>`;
  $('#view').innerHTML=S.cur==='TOOLS'?toolsView():airlineView(S.cur);
  update();
}
let tT; const toast=m=>{const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(tT);tT=setTimeout(()=>t.hidden=true,1800);};
const touched=()=>{ if(S.sample[S.cur]){S.sample[S.cur]=false;const p=$('#smp');p&&p.setAttribute('aria-pressed','false');} };

document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.t){S.tools[el.dataset.t]=el.value;return update();}
  if(el.dataset.limit){S.limit=el.value.trim();return update();}
  if(S.cur==='TOOLS') return;
  if(el.dataset.k){v[el.dataset.k]=el.value.trim();touched();}
  else if(el.dataset.up){s.uplifts[+el.dataset.up][el.dataset.f]=el.value.trim();touched();}
  else if(el.dataset.sg){s.sg=el.value.trim();touched();}
  else if(el.dataset.sgd){const d=el.value.replace(/[^0-9]/g,'');if(d!==el.value)el.value=d;s.sg=d?'0.'+d:'';touched();}
  update();
});
let clrArm=0;
document.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.go){S.cur=b.dataset.go;render();window.scrollTo({top:0});return;}
  if(b.dataset.tu){S.tools.cu=b.dataset.tu;$$('[data-tu]').forEach(x=>x.setAttribute('aria-pressed',x===b));return update();}
  if(S.cur==='TOOLS') return;
  const id=S.cur;
  if(b.dataset.sgstep){const c=parseFloat(s.sg)||0.79;let t=(Math.round((c+0.0005*+b.dataset.sgstep)*10000)/10000).toFixed(4);if(t.endsWith('0'))t=t.slice(0,-1);s.sg=t;$$('#f-sg').forEach(x=>x.value=x.dataset.sgd?sgDec():s.sg);touched();return update();}
  if(b.dataset.bu){s.bu=b.dataset.bu;touched();return render();}
  if(b.dataset.gs!==undefined){v['gs_'+b.dataset.gs]=b.dataset.gv;$$(`[data-gs="${b.dataset.gs}"]`).forEach(x=>x.setAttribute('aria-pressed',x===b));touched();return save();}
  if(b.dataset.addup){s.uplifts.push({v:'',r:''});if(s.uplifts.length===2&&!s.uplifts[0].v){}touched();render();const n=$('#f-up'+(s.uplifts.length-1));n&&n.focus();return;}
  if(b.dataset.del!==undefined){s.uplifts.splice(+b.dataset.del,1);touched();return render();}
  if(b.dataset.neg){const k=b.dataset.neg,c=v[k]||'';v[k]=c.startsWith('-')?c.slice(1):'-'+c;$('#f-'+k).value=v[k];touched();return update();}
  if(b.dataset.actype){v.acType=b.dataset.actype;touched();return render();}
  if(b.id==='xbtn'){S.explain=!S.explain;b.setAttribute('aria-expanded',S.explain);$('#exp').hidden=!S.explain;return update();}
  if(b.id==='clr'){
    if(!clrArm){clrArm=1;b.textContent='한 번 더';setTimeout(()=>{clrArm=0;if(document.body.contains(b))b.textContent='비우기';},2500);return;}
    clrArm=0;S.data[id]={sg:s.sg,bu:s.bu,uplifts:[{v:'',r:''}],vals:{acType:v.acType,ft1:'JET A-1',grade:'JET A-1',ft:'JET A-1',sup:DEF_SUP[id]}};S.sample[id]=false;render();toast('입력값을 비웠어요 (SG·단위·기종은 유지)');return;}
  if(b.id==='smp'){if(!SAMPLES[id])return;S.data[id]=clone(SAMPLES[id]);S.sample[id]=true;render();toast('양식 사진 예시값을 불러왔어요');return;}
});
render();
})();
</script>

<script>if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){navigator.serviceWorker.register("sw.js")}</script>
</body></html>
